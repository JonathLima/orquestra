[package]
name = "orquestra-init"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
orquestra-core = { path = "../orquestra-core" }
orquestra-plan = { path = "../orquestra-plan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
thiserror = "2"
sha2 = "0.10"
url = "2"
psl = "2"

[dev-dependencies]
tempfile = "3"
