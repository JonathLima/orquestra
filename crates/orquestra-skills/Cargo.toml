[package]
name = "orquestra-skills"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
orquestra-core = { path = "../orquestra-core" }
orquestra-plan = { path = "../orquestra-plan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
